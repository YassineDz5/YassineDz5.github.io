<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0e12">
<title>FoxDz — دردشة</title>
<script>document.write('<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">')</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__bip=e;var b=document.getElementById('installBtn');if(b)b.classList.remove('hide')})</script>
<link rel="stylesheet" href="style.css">
<script>if(location.protocol==='file:'){addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.className='msg err';d.style.margin='14px';d.textContent='⚠️ راك فاتح الصفحة من الملف مباشرة. لازم تفتحها عبر رابط الموقع (GitHub Pages) أو localhost باش Firebase يخدم.';document.body.insertBefore(d,document.body.firstChild)})}</script>
<style>
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
.head{padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(13,14,18,.9)}
.head .top{max-width:680px;margin:0 auto}
#list{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;max-width:680px;width:100%;margin:0 auto}
.bub{max-width:82%;padding:9px 13px;border-radius:18px;margin:4px 0;white-space:pre-wrap;word-break:break-word;font-size:15px}
.bub small{display:block;font-size:11px;opacity:.65;margin-top:3px}
.me{align-self:flex-start;background:linear-gradient(135deg,var(--or),var(--or2));color:#1a0e00;border-end-start-radius:5px}
.them{align-self:flex-end;background:var(--card2);border:1px solid var(--line);border-end-end-radius:5px}
.sys{align-self:center;background:transparent;color:var(--mut);font-size:12px;border:1px dashed var(--line);border-radius:30px;padding:5px 12px}
.bar{border-top:1px solid var(--line);padding:10px 14px;background:rgba(13,14,18,.95)}
.bar .in{max-width:680px;margin:0 auto;display:flex;gap:8px}
.bar button{margin:0;flex:none}
</style>
</head>
<body>
<div class="head"><div class="top">
  <a id="back" class="btn sec sm" href="index.html">→ رجوع</a>
  <div style="flex:1;min-width:0;text-align:center"><b id="ttl" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">دردشة</b><span id="st" class="badge"></span></div>
  <span id="logo"></span>
</div></div>

<div id="list"></div>
<div id="login" class="msg err hide" style="margin:14px">سجّل الدخول أولاً من <a href="index.html">الصفحة الرئيسية</a>.</div>

<div class="bar hide" id="bar"><div class="in">
  <input id="txt" placeholder="اكتب رسالتك..." maxlength="1000" autocomplete="off">
  <button id="send">إرسال</button>
</div></div>

<script type="module">
import { firebaseConfig, ADMIN_EMAIL, STATUS, esc, timeFmt, LOGO } from "./common.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, addDoc, collection, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const $ = id => document.getElementById(id);
$("logo").innerHTML = LOGO(32);
const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);
const oid = new URLSearchParams(location.search).get("o");
let isAdmin = false, unsub = null;

onAuthStateChanged(auth, async u => {
  if (unsub) { unsub(); unsub = null; }
  if (!u || !oid) { $("login").classList.remove("hide"); $("bar").classList.add("hide"); return; }
  $("login").classList.add("hide");
  isAdmin = u.email === ADMIN_EMAIL && u.emailVerified;
  if (isAdmin) $("back").href = "admin.html";
  try {
    const o = (await getDoc(doc(db, "orders", oid))).data();
    if (!o) throw new Error("none");
    $("ttl").textContent = isAdmin ? `${o.name} · ${o.title || "منتج"}` : (o.title || "طلبك");
    $("st").textContent = STATUS[o.status] || o.status;
    $("st").className = "badge b-" + o.status;
  } catch (e) {
    $("list").innerHTML = '<div class="msg err">هذا الطلب غير موجود أو ماعندكش صلاحية.</div>'; return;
  }
  $("bar").classList.remove("hide");
  unsub = onSnapshot(query(collection(db, "orders", oid, "messages"), orderBy("createdAt")), snap => {
    const box = $("list");
    const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
    box.innerHTML = snap.docs.map(d => {
      const m = d.data();
      if (m.from === "system") return `<div class="bub sys">${esc(m.text)}</div>`;
      const mine = (m.from === "admin") === isAdmin;
      return `<div class="bub ${mine ? "me" : "them"}">${esc(m.text)}<small>${mine ? "" : (m.from === "admin" ? "FoxDz · " : "الزبون · ")}${esc(timeFmt(m.createdAt))}</small></div>`;
    }).join("") || '<div class="muted" style="text-align:center;margin-top:30px">ابدأ المحادثة 👋</div>';
    if (stick || snap.docs.length < 3) box.scrollTop = box.scrollHeight;
  }, () => { $("list").innerHTML = '<div class="msg err">تعذر تحميل الرسائل</div>'; });
});

async function send() {
  const t = $("txt").value.trim();
  if (!t || !oid) return;
  $("txt").value = "";
  try {
    await addDoc(collection(db, "orders", oid, "messages"), { from: isAdmin ? "admin" : "customer", text: t.slice(0, 1000), createdAt: serverTimestamp() });
  } catch (e) { $("txt").value = t; }
}
$("send").onclick = send;
$("txt").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); send(); } });
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js")})</script>
</body>
</html>
