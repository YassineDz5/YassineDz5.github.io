<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f3ec">
<title>FoxDz — لوحة الأدمن</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script>if(location.protocol==='file:'){addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.className='msg err';d.style.margin='14px';d.textContent='⚠️ راك فاتح الصفحة من الملف مباشرة. لازم تفتحها عبر رابط الموقع (GitHub Pages) أو localhost باش Firebase يخدم.';document.body.insertBefore(d,document.body.firstChild)})}</script>
<script>document.write('<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">')</script>
</head>
<body style="padding-bottom:20px">
<div class="wrap">
  <div class="top">
    <div class="brand"><span id="logo"></span><div>Fox<b>Dz</b><small>لوحة التحكم</small></div></div>
    <button id="logout" class="sec sm hide">خروج</button>
  </div>

  <div id="authBox" class="card">
    <h2>دخول الأدمن</h2>
    <label>الإيميل</label><input id="email" type="email">
    <label>كلمة السر</label><input id="pass" type="password">
    <div id="authMsg"></div>
    <button id="authBtn" class="full">دخول</button>
    <button id="forgot" class="linkbtn">نسيت كلمة السر؟</button>
    <div class="or">أو</div>
    <button id="gBtn" class="sec full" style="margin-top:8px">🔵 الدخول بحساب Google</button>
  </div>
  <div id="denied" class="msg err hide">هذا الحساب ليس أدمن، أو الإيميل غير مؤكد. ادخل بحساب Google.</div>

  <div id="panel" class="hide">
    <div class="tiles" id="tiles"></div>

    <div class="tabs" style="overflow-x:auto;white-space:nowrap">
      <button id="tabO">الطلبات</button>
      <button id="tabC" class="sec">الكوبونات</button>
      <button id="tabP" class="sec">التقرير</button>
      <button id="tabR" class="sec">الآراء</button>
      <button id="tabS" class="sec">الإعدادات</button>
    </div>

    <div id="viewO"><div class="chips" id="chips"></div><div id="orders"></div></div>

    <div id="viewC" class="hide">
      <div class="card">
        <h2>كوبون جديد</h2>
        <div class="row">
          <div><label>الكود</label><input id="c_code" placeholder="FOX10" style="text-transform:uppercase" maxlength="30"></div>
          <div><label>النوع</label><select id="c_type"><option value="pct">٪ من العمولة</option><option value="fixed">مبلغ ثابت (دج)</option></select></div>
        </div>
        <div class="row">
          <div><label>القيمة</label><input id="c_val" type="number" step="1" min="1"></div>
          <div><label>أقصى استعمال (0 = بلا حد)</label><input id="c_max" type="number" min="0" value="0"></div>
        </div>
        <label>ينتهي في (اختياري)</label><input id="c_exp" type="date">
        <div id="cMsg"></div>
        <button id="c_add" class="full">إضافة الكوبون</button>
        <div class="muted" style="margin-top:8px">التخفيض يطبق على عمولتك فقط، ولا يتجاوزها أبداً.</div>
      </div>
      <div id="coupons"></div>
    </div>

    <div id="viewP" class="hide">
      <div class="card">
        <h2>تقرير شهري</h2>
        <label>الشهر</label><input id="p_month" type="month">
        <div id="report"></div>
        <button id="p_csv" class="sec full" style="margin-top:10px">⬇️ تصدير CSV</button>
      </div>
      <div class="card">
        <h2>حاسبة ربح إعادة البيع</h2>
        <div class="row">
          <div><label>سعر المنتج ($)</label><input id="k_price" type="number" step="0.01"></div>
          <div><label>الكمية</label><input id="k_qty" type="number" min="1" value="1"></div>
        </div>
        <div class="row">
          <div><label>الشحن ($)</label><input id="k_ship" type="number" step="0.01" value="0"></div>
          <div><label>سعر الصرف</label><input id="k_rate" type="number" step="0.5"></div>
        </div>
        <div class="row">
          <div><label>مصاريف إضافية (دج)</label><input id="k_extra" type="number" value="0"></div>
          <div><label>سعر البيع للقطعة (دج)</label><input id="k_sell" type="number"></div>
        </div>
        <div id="calcOut"></div>
      </div>
    </div>

    <div id="viewR" class="hide"><div id="revs"></div></div>

    <div id="viewS" class="card hide">
      <h2>الإعدادات</h2>
      <div class="row">
        <div><label>سعر الصرف (دج/$)</label><input id="s_rate" type="number" step="0.5"></div>
        <div><label>العمولة %</label><input id="s_pct" type="number" step="0.5"></div>
      </div>
      <div class="row">
        <div><label>أقل عمولة (دج)</label><input id="s_min" type="number"></div>
        <div><label>الشحن لكل طلب ($)</label><input id="s_ship" type="number" step="0.1"></div>
      </div>
      <label>طريقة الدفع (تظهر للزبون)</label><textarea id="s_pay"></textarea>
      <label>تخفيض كود الإحالة (دج) للصديق الجديد</label><input id="s_ref" type="number" min="0">
      <label>إعلان أعلى الموقع (اتركه فارغ لإخفائه)</label><input id="s_banner" maxlength="120" placeholder="مثلاً: تخفيضات 11.11 بدات 🔥">
      <label>رابط التواصل (تيليغرام / واتساب) يظهر كزر 💬</label><input id="s_contact" type="url" placeholder="https://t.me/...">
      <div id="sMsg"></div>
      <button id="s_save" class="full">حفظ الإعدادات</button>
    </div>
  </div>
</div>

<script type="module">
import { toast, hookErrors, firebaseConfig, ADMIN_EMAIL, DEFAULTS, calc, STATUS, esc, safeUrl, httpsOnly, timeFmt, LOGO } from "./common.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, query, orderBy, onSnapshot, deleteField, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const $ = id => document.getElementById(id);
hookErrors();
$("logo").innerHTML = LOGO(44);
const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);

let settings = { ...DEFAULTS }, all = [], reviews = [], unsubs = [], filter = "";
const openIds = new Set();

$("logout").onclick = () => signOut(auth);
$("authBtn").onclick = async () => {
  $("authMsg").innerHTML = "";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); }
  catch (e) { $("authMsg").innerHTML = '<div class="msg err">بيانات غالطة</div>'; }
};
$("forgot").onclick = async () => {
  const em = $("email").value.trim();
  if (!em) { $("authMsg").innerHTML = '<div class="msg err">اكتب الإيميل أولاً</div>'; return; }
  try { await sendPasswordResetEmail(auth, em); } catch (e) {}
  $("authMsg").innerHTML = '<div class="msg ok">إذا كان الإيميل مسجلاً وصلك رابط الاستعادة</div>';
};
$("gBtn").onclick = async () => {
  $("authMsg").innerHTML = "";
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { if (!["auth/popup-closed-by-user", "auth/cancelled-popup-request"].includes(e.code)) $("authMsg").innerHTML = '<div class="msg err">تعذر الدخول بـ Google</div>'; }
};

function tab(t) {
  $("viewO").classList.toggle("hide", t !== "o");
  $("viewR").classList.toggle("hide", t !== "r");
  $("viewS").classList.toggle("hide", t !== "s");
  $("viewC").classList.toggle("hide", t !== "c");
  $("viewP").classList.toggle("hide", t !== "p");
  for (const k of ["O", "C", "P", "R", "S"]) $("tab" + k).className = t === k.toLowerCase() ? "" : "sec";
  if (t === "p") renderReport();
}
for (const k of ["O", "C", "P", "R", "S"]) $("tab" + k).onclick = () => tab(k.toLowerCase());

function fillSettings() {
  $("s_rate").value = settings.rate; $("s_pct").value = settings.commissionPct; $("s_min").value = settings.minCommission;
  $("s_ship").value = settings.shippingUsd; $("s_pay").value = settings.payInfo; $("s_banner").value = settings.banner || ""; $("s_contact").value = settings.contact || "";
  $("s_ref").value = settings.refDiscountDzd ?? 200; $("k_rate").value = $("k_rate").value || settings.rate;
}
$("s_save").onclick = async () => {
  const s = {
    rate: parseFloat($("s_rate").value), commissionPct: parseFloat($("s_pct").value), minCommission: parseFloat($("s_min").value),
    shippingUsd: parseFloat($("s_ship").value), payInfo: $("s_pay").value.trim(), banner: $("s_banner").value.trim(), contact: httpsOnly($("s_contact").value.trim()), refDiscountDzd: parseFloat($("s_ref").value) || 0
  };
  if ([s.rate, s.commissionPct, s.minCommission, s.shippingUsd].some(x => !(x >= 0)) || !(s.rate > 0)) {
    $("sMsg").innerHTML = '<div class="msg err">تأكد من القيم</div>'; return;
  }
  try { await setDoc(doc(db, "config", "settings"), s); settings = s; render(); $("sMsg").innerHTML = '<div class="msg ok">تم الحفظ ✓</div>'; }
  catch (e) { $("sMsg").innerHTML = '<div class="msg err">فشل الحفظ</div>'; }
};

function render() {
  const counts = {};
  all.forEach(o => counts[o.status] = (counts[o.status] || 0) + 1);
  const profit = all.filter(o => o.status === "delivered").reduce((a, o) => a + (o.commission || 0), 0);
  const problems = (counts.delayed || 0) + (counts.held || 0);
  $("tiles").innerHTML = `
    <div class="tile"><b>${counts.new || 0}</b><span>⏳ في انتظار الدفع</span></div>
    <div class="tile"><b class="grad">${counts.paid || 0}</b><span>🛍️ جاهزة للشراء</span></div>
    <div class="tile"><b>${problems}</b><span>⚠️ متأخرة / محجوزة</span></div>
    <div class="tile"><b>${profit} دج</b><span>💰 عمولة الطلبات المسلّمة</span></div>`;

  $("chips").innerHTML = `<button class="chip ${filter ? "" : "on"}" data-chip="">الكل (${all.length})</button>` +
    Object.entries(STATUS).filter(([k]) => counts[k]).map(([k, v]) => `<button class="chip ${filter === k ? "on" : ""}" data-chip="${k}">${esc(v)} (${counts[k]})</button>`).join("");

  const list = filter ? all.filter(o => o.status === filter) : all;
  $("orders").innerHTML = list.map(o => {
    const exp = calc(o.priceUsd, o.qty, settings).total - (o.discountDzd || 0);
    const mismatch = Math.abs(exp - o.totalDzd) > 10;
    const img = httpsOnly(o.image);
    return `<details data-id="${esc(o.id)}" ${openIds.has(o.id) ? "open" : ""}>
      <summary><div class="ord">
        ${img ? `<img src="${esc(img)}" alt="" referrerpolicy="no-referrer">` : '<div class="ph">📦</div>'}
        <div class="grow"><b>${esc(o.name)} ${o.lastMsgFrom === "customer" ? '<span class="dot"></span>' : ""}</b>
          <div class="muted">${o.store ? esc(o.store) + " · " : ""}${esc(o.title || "منتج")} · ${esc(o.totalDzd)} دج</div></div>
        <span class="badge b-${esc(o.status)}">${esc(STATUS[o.status] || o.status)}</span>
      </div></summary>
      <div class="body">
        <div class="kv"><span>${esc(timeFmt(o.createdAt))}</span></div>
        <div class="kv">${esc(o.priceUsd)}$ × ${esc(o.qty)} · المطلوب <b>${esc(o.totalDzd)} دج</b>
          ${mismatch ? `<span class="badge b-held">بالإعدادات الحالية: ${exp} دج</span>` : ""}</div>
        ${o.coupon ? `<div class="kv">🎟️ ${o.couponKind === "ref" ? "كود إحالة" : "كوبون"}: <b>${esc(o.coupon)}</b> (-${esc(o.discountDzd || 0)} دج)${o.refOwner ? ` · صاحب الكود: ${esc(refName(o.refOwner))}` : ""}</div>` : ""}
        ${o.notes ? `<div class="kv"><span>ملاحظات:</span> ${esc(o.notes)}</div>` : ""}
        <div class="kv">👤 ${esc(o.name)} · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></div>
        <div class="kv">📍 ${esc(o.wilaya)} / ${esc(o.daira || "—")} / ${esc(o.postalCode || "—")}<br>${esc(o.address)}</div>
        <div class="kv" data-kycbox="1">${kycHtml(o)}</div>
        <div class="kv">🧾 وصل الدفع: <b>${esc(o.paymentRef || "—")}</b></div>
        <label>الحالة</label>
        <select data-f="status" data-id="${esc(o.id)}">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === o.status ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>
        <div class="row">
          <div><label>المبلغ النهائي المؤكد (دج) — يُرسل للزبون</label><input data-f="finalDzd" data-id="${esc(o.id)}" type="number" min="0" value="${o.finalDzd ?? ""}" placeholder="${esc(o.totalDzd)}"></div>
          <div><label>تكلفتك الفعلية (دج)</label><input data-f="costDzd" data-id="${esc(o.id)}" type="number" min="0" value="${o.costDzd ?? ""}"></div>
        </div>
        <label>رقم التتبع</label><input data-f="tracking" data-id="${esc(o.id)}" value="${esc(o.tracking)}">
        <label>ملاحظة تظهر للزبون (سبب التأخر / الحجز / الإرجاع)</label>
        <textarea data-f="adminNote" data-id="${esc(o.id)}">${esc(o.adminNote)}</textarea>
        <div class="row" style="margin-top:12px">
          <button data-save="${esc(o.id)}" style="margin:0">حفظ</button>
          <a class="btn sec" style="margin:0" href="chat.html?o=${encodeURIComponent(o.id)}">💬 دردشة</a>
          <a class="btn sec" style="margin:0" href="${esc(safeUrl(o.link))}" target="_blank" rel="noopener noreferrer">🔗 المنتج</a>
        </div>
      </div></details>`;
  }).join("") || '<div class="muted">لا توجد طلبات</div>';
}

const kycCache = {};
const kycHtml = o => kycCache[o.uid] || `<button class="sec sm" data-kyc="${esc(o.uid)}" style="margin:0">🪪 بيانات الزبون والبطاقة</button>`;
async function loadKyc(uid, btn) {
  try {
    const [u, k] = await Promise.all([getDoc(doc(db, "users", uid)), getDoc(doc(db, "kyc", uid))]);
    const p = u.exists() ? u.data() : {};
    const img = k.exists() && typeof k.data().img === "string" && k.data().img.startsWith("data:image/jpeg;base64,") ? k.data().img : "";
    kycCache[uid] = `<div class="kv">🪪 ${esc([p.firstName, p.lastName].filter(Boolean).join(" ") || "—")} · العمر: <b>${esc(p.age ?? "—")}</b></div>` +
      (img ? `<a href="${img}" target="_blank" rel="noopener"><img src="${img}" alt="" style="max-width:100%;max-height:220px;border-radius:8px;border:1px solid var(--line)"></a>` : '<div class="muted">لا توجد صورة بطاقة</div>');
    btn.parentElement.innerHTML = kycCache[uid];
  } catch (e) { toast("تعذر تحميل بيانات الزبون: " + (e.code || e.message)); }
}
const refName = uid => { const o = all.find(x => x.uid === uid); return o ? o.name : "—"; };

// ===== الكوبونات =====
let coupons = [];
function renderCoupons() {
  $("coupons").innerHTML = coupons.map(c => `<div class="card"><b style="letter-spacing:2px">${esc(c.id)}</b>
    <span class="badge ${c.active === false ? "b-held" : "b-paid"}">${c.active === false ? "متوقف" : "فعال"}</span>
    <div class="muted">${c.type === "pct" ? esc(c.value) + "% من العمولة" : esc(c.value) + " دج"} · استعمال ${esc(c.uses || 0)}${c.maxUses ? "/" + esc(c.maxUses) : ""}${c.expires ? " · ينتهي " + esc(c.expires) : ""}</div>
    <div class="row" style="margin-top:10px">
      <button class="sec sm" data-tog="${esc(c.id)}" style="margin:0">${c.active === false ? "تفعيل" : "إيقاف"}</button>
      <button class="sec sm" data-delc="${esc(c.id)}" style="margin:0">🗑️ حذف</button></div></div>`).join("") || '<div class="muted">لا توجد كوبونات</div>';
}
$("c_add").onclick = async () => {
  const code = $("c_code").value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g, "");
  const val = parseFloat($("c_val").value), type = $("c_type").value;
  if (!code || !(val > 0) || (type === "pct" && val > 100)) { $("cMsg").innerHTML = '<div class="msg err">تأكد من الكود والقيمة</div>'; return; }
  if (coupons.some(c => c.id === code)) { $("cMsg").innerHTML = '<div class="msg err">الكود موجود</div>'; return; }
  try {
    await setDoc(doc(db, "coupons", code), { type, value: val, maxUses: parseInt($("c_max").value) || 0, expires: $("c_exp").value || "", active: true, uses: 0, createdAt: serverTimestamp() });
    $("c_code").value = ""; $("c_val").value = ""; $("cMsg").innerHTML = '<div class="msg ok">تمت الإضافة ✓</div>';
  } catch (e) { $("cMsg").innerHTML = '<div class="msg err">فشلت الإضافة</div>'; }
};
$("coupons").addEventListener("click", async e => {
  const t = e.target.dataset?.tog, d = e.target.dataset?.delc;
  try {
    if (t) { const c = coupons.find(x => x.id === t); await updateDoc(doc(db, "coupons", t), { active: c.active === false }); }
    else if (d && confirm("حذف الكوبون؟")) await deleteDoc(doc(db, "coupons", d));
  } catch (err) { e.target.textContent = "خطأ"; }
});

// ===== التقرير الشهري =====
const DONE = ["purchased", "shipped", "arrived", "delivered"];
const ym = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
$("p_month").value = ym(new Date());
function monthOrders() {
  const m = $("p_month").value;
  return all.filter(o => o.createdAt?.toDate && ym(o.createdAt.toDate()) === m);
}
function stats() {
  const list = monthOrders();
  const dl = list.filter(o => o.status === "delivered");
  const rev = dl.reduce((a, o) => a + (o.finalDzd ?? o.totalDzd ?? 0), 0);
  const withCost = dl.filter(o => o.costDzd != null);
  const profitReal = withCost.reduce((a, o) => a + (o.finalDzd ?? o.totalDzd ?? 0) - o.costDzd, 0);
  const profitEst = dl.filter(o => o.costDzd == null).reduce((a, o) => a + Math.max(0, (o.commission || 0) - (o.discountDzd || 0)), 0);
  const refunds = list.filter(o => o.status === "refunded").length;
  const used = list.filter(o => o.coupon);
  const disc = used.reduce((a, o) => a + (o.discountDzd || 0), 0);
  const refs = {};
  list.filter(o => o.couponKind === "ref" && o.refOwner).forEach(o => refs[o.refOwner] = (refs[o.refOwner] || 0) + 1);
  return { list, dl, rev, profitReal, profitEst, refunds, used, disc, refs, withCost: withCost.length };
}
function renderReport() {
  const r = stats();
  const top = Object.entries(r.refs).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([u, n]) => `${esc(refName(u))}: ${n}`).join(" · ");
  $("report").innerHTML = `<div class="tiles">
    <div class="tile"><b>${r.list.length}</b><span>طلبات الشهر</span></div>
    <div class="tile"><b>${r.dl.length}</b><span>مسلّمة</span></div>
    <div class="tile"><b class="grad">${r.rev} دج</b><span>مداخيل المسلّمة</span></div>
    <div class="tile"><b class="grad">${r.profitReal + r.profitEst} دج</b><span>الربح (${r.withCost} بتكلفة فعلية، الباقي تقديري من العمولة)</span></div>
    </div>
    <div class="kv">↩️ مرتجعة: <b>${r.refunds}</b></div>
    <div class="kv">🎟️ طلبات بكود: <b>${r.used.length}</b> · تخفيضات ممنوحة: <b>${r.disc} دج</b></div>
    ${top ? `<div class="kv">🎁 أكثر المحيلين: ${top}</div>` : ""}
    <div class="muted">مكافأة صاحب كود الإحالة يدوية، تعطيه ما تراه مناسباً.</div>`;
}
$("p_month").addEventListener("input", renderReport);
const csvCell = v => { let t = String(v ?? ""); if (/^[=+\-@]/.test(t)) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"'; };
$("p_csv").onclick = () => {
  const rows = [["التاريخ", "الاسم", "المتجر", "المنتج", "الحالة", "المطلوب", "النهائي", "التكلفة", "الكود", "التخفيض"]];
  monthOrders().forEach(o => rows.push([timeFmt(o.createdAt), o.name, o.store, o.title, STATUS[o.status] || o.status, o.totalDzd, o.finalDzd, o.costDzd, o.coupon, o.discountDzd]));
  const blob = new Blob(["\ufeff" + rows.map(r => r.map(csvCell).join(",")).join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "foxdz-" + $("p_month").value + ".csv"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};

// ===== حاسبة إعادة البيع =====
function runCalc() {
  const g = id => parseFloat($(id).value) || 0;
  const qty = Math.max(1, Math.floor(g("k_qty"))), rate = g("k_rate");
  const cost = Math.round((g("k_price") * qty + g("k_ship")) * rate + g("k_extra"));
  const rev = Math.round(g("k_sell") * qty), profit = rev - cost;
  const unit = Math.round(cost / qty);
  $("calcOut").innerHTML = g("k_price") ? `<div class="quote"><div>التكلفة: <b>${cost} دج</b> (${unit} دج للقطعة)</div><div>الدخل: <b>${rev} دج</b></div>
    <div class="tot ${profit >= 0 ? "grad" : ""}">${profit >= 0 ? "ربح" : "خسارة"} ${Math.abs(profit)} دج${rev ? ` · ${Math.round(profit / rev * 100)}%` : ""}</div>
    <div class="muted">أقل سعر بيع للقطعة لتغطية التكلفة: ${unit} دج</div></div>` : "";
}
["k_price", "k_qty", "k_ship", "k_rate", "k_extra", "k_sell"].forEach(i => $(i).addEventListener("input", runCalc));

function renderReviews() {
  $("revs").innerHTML = reviews.map(r => `<div class="card"><b>${esc(r.name)}</b> <span class="stars">${"★".repeat(r.rating || 0)}${"☆".repeat(5 - (r.rating || 0))}</span>
    <span class="muted"> ${esc(timeFmt(r.createdAt))}</span>${r.text ? `<div>${esc(r.text)}</div>` : ""}
    <button class="sec sm" data-delrev="${esc(r.id)}" style="margin-top:10px">🗑️ حذف</button></div>`).join("") || '<div class="muted">لا توجد آراء بعد</div>';
}
$("revs").addEventListener("click", async e => {
  const id = e.target.dataset?.delrev;
  if (!id || !confirm("حذف هذا التقييم؟")) return;
  try { await deleteDoc(doc(db, "reviews", id)); } catch (err) { e.target.textContent = "خطأ"; }
});

$("chips").addEventListener("click", e => { if (e.target.dataset?.chip === undefined) return; filter = e.target.dataset.chip; render(); });
$("orders").addEventListener("toggle", e => { const id = e.target.dataset?.id; if (!id) return; e.target.open ? openIds.add(id) : openIds.delete(id); }, true);
$("orders").addEventListener("click", async e => {
  if (e.target.dataset?.kyc) return loadKyc(e.target.dataset.kyc, e.target);
  const id = e.target.dataset?.save;
  if (!id) return;
  const get = f => [...document.querySelectorAll("[data-id]")].find(x => x.dataset.id === id && x.dataset.f === f).value;
  try {
    const num = f => { const v = get(f).trim(); return v === "" || !(Number(v) >= 0) ? deleteField() : Math.round(Number(v)); };
    await updateDoc(doc(db, "orders", id), { status: get("status"), tracking: get("tracking").trim(), adminNote: get("adminNote").trim(), finalDzd: num("finalDzd"), costDzd: num("costDzd"), updatedAt: serverTimestamp() });
    e.target.textContent = "تم ✓";
  } catch (err) { e.target.textContent = "خطأ"; toast("تعذر الحفظ: " + (err.code || err.message)); }
});

onAuthStateChanged(auth, async u => {
  unsubs.forEach(f => f()); unsubs = [];
  const isAdmin = !!u && u.email === ADMIN_EMAIL && u.emailVerified;
  $("authBox").classList.toggle("hide", !!u);
  $("logout").classList.toggle("hide", !u);
  $("denied").classList.toggle("hide", !(u && !isAdmin));
  $("panel").classList.toggle("hide", !isAdmin);
  if (!isAdmin) return;
  try { const s = await getDoc(doc(db, "config", "settings")); if (s.exists()) settings = { ...DEFAULTS, ...s.data() }; } catch (e) {}
  fillSettings();
  unsubs.push(onSnapshot(query(collection(db, "orders"), orderBy("createdAt", "desc")), snap => {
    all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!$("orders").contains(document.activeElement)) render(); // ما نمسحوش اللي راك تكتب فيه
    if (!$("viewP").classList.contains("hide")) renderReport();
  }, err => toast("تعذر تحميل الطلبات: " + (err.code || err.message))));
  unsubs.push(onSnapshot(collection(db, "coupons"), snap => { coupons = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderCoupons(); }, err => toast("تعذر تحميل الكوبونات: " + (err.code || err.message))));
  unsubs.push(onSnapshot(query(collection(db, "reviews"), orderBy("createdAt", "desc")), snap => {
    reviews = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderReviews();
  }, err => toast("تعذر تحميل الآراء: " + (err.code || err.message))));
});
</script>
